name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        # macOS ships bash 3.2; the plugin needs bash 4+ first on PATH.
        run: |
          brew install bash jq shellcheck
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pytest
      - run: shellcheck bin/tmux-agent lib/engine.sh lib/install-hooks lib/raise tmux-agentic.tmux
      - run: pytest tests
