name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        # macOS ships bash 3.2; the plugin needs bash 4+ first on PATH.
        run: |
          brew install bash jq shellcheck
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: pip install pytest
      - run: shellcheck bin/tmux-agent lib/engine.sh lib/remote.sh lib/install-hooks lib/raise tmux-agentic.tmux
      - run: pytest tests
