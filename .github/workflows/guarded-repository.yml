name: Guarded Repository

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Verifications expire after 7 days; refresh weekly.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  guard:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      security-events: write
    uses: hashgraph-online/hol-guard/.github/workflows/guarded-repository.yml@fc5f50cca519ccacfeae8edea4f0c4744d788d67 # v3.59.0
    with:
      profile: strict-security
      fail_on_severity: high
      upload_sarif: true
      visibility: public
